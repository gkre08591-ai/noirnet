[package]
name = "noirnet-core"
version = "0.1.0"
edition = "2021"
authors = ["NoirNet Team"]
license = "MIT OR Apache-2.0"
description = "Core types and utilities for NoirNet blockchain node"
repository = "https://github.com/noirnet/noirnet"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
noirnet-types = { path = "../noirnet-types", version = "0.1.0" }
noirnet-crypto = { path = "../noirnet-crypto", version = "0.1.0" }

# Async runtime
tokio = { workspace = true }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"
color-eyre = "0.6"

# Utilities
once_cell = "1.19"
lazy_static = "1.4"
uuid = { version = "1.6", features = ["v4"] }

# Logging and tracing
tracing = "0.1"
metrics = "0.22"

[dev-dependencies]
mockall = "0.13"
proptest = "1.4"
tokio-test = "0.4"