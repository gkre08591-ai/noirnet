[package]
name = "noirnet-p2p"
version = "0.1.0"
edition = "2021"
authors = ["NoirNet Team"]
license = "MIT OR Apache-2.0"
description = "P2P protocol implementation and message handling for NoirNet"
repository = "https://github.com/noirnet/noirnet"
keywords = ["p2p", "protocol", "messaging", "gossipsub", "libp2p"]
categories = ["network-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
noirnet-types = { path = "../noirnet-types", version = "0.1.0" }
noirnet-core = { path = "../noirnet-core", version = "0.1.0" }
noirnet-crypto = { path = "../noirnet-crypto", version = "0.1.0" }
noirnet-network = { path = "../noirnet-network", version = "0.1.0" }
noirnet-mempool = { path = "../noirnet-mempool", version = "0.1.0" }

# P2P networking
libp2p = { workspace = true }
libp2p-gossipsub = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
prost = "0.12"
prost-types = "0.12"

# Async runtime
tokio = { workspace = true }
futures = "0.3"
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"
color-eyre = "0.6"

# Utilities
once_cell = "1.19"
tracing = "0.1"
metrics = "0.22"
tracing-subscriber = { workspace = true }

# Compression
flate2 = "1.0"
snap = "1.1"

[dev-dependencies]
mockall = "0.13"
tempfile = "3.8"

[features]
default = ["std", "gossipsub", "compression"]
std = [
    "serde/std",
]
gossipsub = []
compression = []
relay = []

[[example]]
name = "p2p-test"
path = "examples/test.rs"