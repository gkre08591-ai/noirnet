[workspace]
resolver = "2"
members = [
    "crates/noirnet-core",
    "crates/noirnet-types",
    "crates/noirnet-crypto",
    "crates/noirnet-storage",
    "crates/noirnet-zk",
    "crates/noirnet-network",
    "crates/noirnet-consensus",
    "crates/noirnet-rpc",
    "crates/noirnet-vm",
    "crates/noirnet-node",
    "crates/noirnet-mempool",
    "crates/noirnet-wallet",
    "bin/noirnet-node",
    "bin/noirnet-cli",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NoirNet Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/noirnet/noirnet"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.41", features = ["full", "tracing"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Cryptography - arkworks
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-poly = "0.4"
ark-serialize = "0.4"
ark-std = { version = "0.4", features = ["std"] }
ark-groth16 = "0.4"
ark-r1cs-std = "0.4"

# Alternative crypto libs
blake3 = "1.5"
blst = "0.3.16"
argon2 = "0.5"
ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = "4.1"
chacha20poly1305 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
rand_core = "0.6"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
digest = "0.10"

# P2P networking
libp2p = { version = "0.53", default-features = false, features = ["tcp", "tls", "tokio", "noise", "yamux", "gossipsub", "kad", "mdns", "identify", "ping", "request-response", "json", "cbor", "dcutr", "upnp"] }
libp2p-gossipsub = "0.46"

# Storage
rocksdb = { version = "0.22", features = ["lz4", "zstd", "multi-threaded-cf"] }
sled = "0.34"
tempfile = "3.8"

# WASM
wasmtime = "22"
wasmtime-wasi = "22"
wasm-bindgen = "0.2"
wasmer = "4.0"

# RPC
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
jsonrpsee = { version = "0.24", features = ["server", "client", "macros", "http-client", "ws-client"] }
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots", "prost", "codegen"] }
prost = "0.12"
prost-types = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rlp = "0.5"

# Utilities
bs58 = "0.5"
num_cpus = "1.16"
parking_lot = "0.12"
dashmap = "6.0"
prometheus = "0.13"
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"
color-eyre = "0.6"
ouroboros = "0.18"
clap = { version = "4.4", features = ["derive", "env"] }
config = "0.13"
dotenvy = "0.15"
once_cell = "1.19"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
regex = "1.10"
mimalloc = "0.1"

# Crypto utilities
hex = "0.4"
base64 = "0.21"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"

# Networking
bytes = "1.6"
http = "1.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
webpki-roots = "0.26"
rustls = "0.23"
rustls-pemfile = "2.0"

# Metrics and observability
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
opentelemetry = "0.22"
opentelemetry-otlp = "0.15"

# Testing
mockall = "0.13"
proptest = "1.4"

# Local Crates
noirnet-core = { path = "crates/noirnet-core" }
noirnet-types = { path = "crates/noirnet-types" }
noirnet-crypto = { path = "crates/noirnet-crypto" }
noirnet-storage = { path = "crates/noirnet-storage" }
noirnet-zk = { path = "crates/noirnet-zk" }
noirnet-network = { path = "crates/noirnet-network" }
noirnet-consensus = { path = "crates/noirnet-consensus" }
noirnet-rpc = { path = "crates/noirnet-rpc" }
noirnet-vm = { path = "crates/noirnet-vm" }
noirnet-node = { path = "crates/noirnet-node" }
noirnet-mempool = { path = "crates/noirnet-mempool" }
noirnet-p2p = { path = "crates/noirnet-p2p" }
noirnet-wallet = { path = "crates/noirnet-wallet" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
