[package]
name = "noirnet-node"
version = "0.1.0"
edition = "2021"
authors = ["NoirNet Team"]
license = "MIT OR Apache-2.0"

[dependencies]
noirnet-types = { path = "../noirnet-types", version = "0.1.0" }
noirnet-core = { path = "../noirnet-core", version = "0.1.0" }
noirnet-crypto = { path = "../noirnet-crypto", version = "0.1.0" }
noirnet-storage = { path = "../noirnet-storage", version = "0.1.0" }
noirnet-zk = { path = "../noirnet-zk", version = "0.1.0" }
noirnet-network = { path = "../noirnet-network", version = "0.1.0" }
noirnet-consensus = { path = "../noirnet-consensus", version = "0.1.0" }
noirnet-rpc = { path = "../noirnet-rpc", version = "0.1.0" }
noirnet-vm = { path = "../noirnet-vm", version = "0.1.0" }
noirnet-mempool = { path = "../noirnet-mempool", version = "0.1.0" }

# CLI
clap = { workspace = true }
dotenvy = { workspace = true }
config = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Error handling
color-eyre = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"

# Utilities
hex = { workspace = true }
once_cell = "1.19"
lazy_static = "1.4"
uuid = { workspace = true }

[dev-dependencies]
mockall = "0.13"
tempfile = "3.8"