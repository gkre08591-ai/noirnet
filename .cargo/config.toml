# Cargo configuration for NoirNet
# Build optimization settings, LTO, PGO, and target specifications

[build]
rustflags = [
    "-C", "target-cpu=native",
]

# PGO settings (Profile Guided Optimization)
# Run with LLVM_PROFILE_FILE="target/profraw/profile-%p.profraw" cargo build --release
# Then use llvm-profdata and lld with PGO
[env]
LLVM_PROFILE_FILE = "target/profraw/profile-%p.profraw"
CARGO_INCREMENTAL = "0"
CARGO_TARGET_DIR = "target/build"
RUST_BACKTRACE = "full"
RUST_LIB_BACKTRACE = "1"
RUSTC_BOOTSTRAP = "0"

# Target-specific optimizations
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=native",
]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "target-feature=+crt-static",
]

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "opt-level=z",
    "-C", "lto",
    "-C", "codegen-units=1",
    "-C", "strip=symbols",
    "-C", "link-arg=--lto-O3",
    "-C", "link-arg=--llvm-opt-opts=O3",
]

# Doc generation settings
[doc]
rustdocflags = [
    "--cfg", "docsrs",
    "-D", "warnings",
]

# Install settings
[install]
root = "target/install"

# Terminology
[term]
verbose = true
color = "always"

# Network settings
[net]
git-fetch-with-cli = false
offline = false

# Credentials
[credentials]
# Token configuration for private registries

# Build cache
[cache]
shared-cache-interval = "10m"

# PGO configuration section
# Uncomment and run `cargo pgo` for profile-guided optimization
# [build]
# rustflags = ["-C", "profile-generate=target/profraw"]
# 
# After profiling:
# [build]
# rustflags = ["-C", "profile-use=target/profdata/profile.profdata"]